# frontend/nginx.conf
# Nginx configuration for serving the Angular SPA.
#
# Key settings:
# - try_files $uri $uri/ /index.html — returns index.html for ALL routes.
#   Angular Router handles routing client-side.  Without this, a direct
#   browser navigation to /orders/123 would return a 404 from Nginx.
#
# - /api/ proxy → FastAPI — allows the frontend to call /api/... without
#   CORS preflight issues (same-origin in production).
#
# - /ws/ proxy → FastAPI WebSocket — WebSocket upgrade headers forwarded.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Angular app — serve index.html for all non-file routes (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket connections to FastAPI
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;  # Keep WS connections alive for 24h
    }

    # Health endpoint for Docker health check
    location /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
