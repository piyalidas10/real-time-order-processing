name: order-processing-system

# ─────────────────────────────────────────────────────────────────────────────
# Real-Time Order Processing System — Docker Compose
#
# Services:
#   postgres       — PostgreSQL 16 database
#   kafka          — Apache Kafka (KRaft mode, no Zookeeper)
#   kafka-ui       — Kafka UI at http://localhost:8080
#   api            — FastAPI application
#   outbox-worker  — Transactional Outbox Worker
#   order-worker   — Order Processing Worker (Kafka consumer)
#   notif-worker   — Notification Worker (Kafka consumer)
#   frontend       — Angular 21 app served by Nginx
#
# Start everything: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpassword}
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderuser} -d ${POSTGRES_DB:-orderdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - order-net

  # ── Kafka (KRaft mode — no Zookeeper) ──────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - order-net

  # ── Kafka UI ────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    ports:
      - "8080:8080"
    networks:
      - order-net

  # ── FastAPI API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      DATABASE_URL_SYNC: "postgresql://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ENVIRONMENT: "development"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - order-net
    restart: on-failure

  # ── Outbox Worker ───────────────────────────────────────────────────────────
  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "workers/outbox_worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - order-net
    restart: on-failure

  # ── Order Worker ─────────────────────────────────────────────────────────────
  order-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "workers/order_worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - order-net
    restart: on-failure

  # ── Notification Worker ──────────────────────────────────────────────────────
  notif-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "workers/notification_worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - order-net
    restart: on-failure

  # ── Angular Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - order-net

volumes:
  postgres_data:
  kafka_data:

networks:
  order-net:
    driver: bridge
