name: order-processing-system

# ─────────────────────────────────────────────────────────────────────────────
# Real-Time Order Processing System — Docker Compose
#
# Services:
#   postgres       — PostgreSQL 16 database
#   kafka          — Apache Kafka 4.3.1 (KRaft mode, no Zookeeper)
#   kafka-ui       — Kafka UI at http://localhost:8080
#   api            — FastAPI application
#   outbox-worker  — Transactional Outbox Worker
#   order-worker   — Order Processing Worker (Kafka consumer)
#   notif-worker   — Notification Worker (Kafka consumer)
#   frontend       — Angular 21 app served by Nginx
#
# Start everything:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpassword}
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-orderuser} -d ${POSTGRES_DB:-orderdb}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - order-net


  # ── Apache Kafka 4.3.1 — KRaft mode, no Zookeeper ──────────────────────────
  kafka:
    image: apache/kafka:4.3.1

    environment:

      # ── KRaft configuration ────────────────────────────────────────────────
      # Single node acts as both broker and controller.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      # ── Listeners ──────────────────────────────────────────────────────────
      #
      # PLAINTEXT  : application/broker traffic
      # CONTROLLER : KRaft controller communication
      #
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"

      # Containers on order-net connect using kafka:9092
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      # ── Controller ─────────────────────────────────────────────────────────
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # ── Listener security ─────────────────────────────────────────────────
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      # Broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # ── Single-node development settings ───────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # ── Topic defaults ─────────────────────────────────────────────────────
      KAFKA_NUM_PARTITIONS: "3"

      # Automatically create topics when first referenced
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Faster consumer group startup during local development
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

    ports:
      - "9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

    networks:
      - order-net


  # ── Kafka UI ────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"

    ports:
      - "8080:8080"

    networks:
      - order-net


  # ── FastAPI API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      DATABASE_URL_SYNC: "postgresql://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ENVIRONMENT: "development"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - order-net

    restart: on-failure


  # ── Transactional Outbox Worker ────────────────────────────────────────────
  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    command:
      - python
      - workers/outbox_worker.py

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - order-net

    restart: on-failure


  # ── Order Processing Worker ─────────────────────────────────────────────────
  order-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    command:
      - python
      - workers/order_worker.py

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - order-net

    restart: on-failure


  # ── Notification Worker ────────────────────────────────────────────────────
  notif-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    command:
      - python
      - workers/notification_worker.py

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+asyncpg://orderuser:orderpassword@postgres:5432/orderdb"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - order-net

    restart: on-failure


  # ── Angular Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "4200:80"

    depends_on:
      - api

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/nginx-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - order-net


# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  kafka_data:


# ─────────────────────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────────────────────

networks:
  order-net:
    driver: bridge